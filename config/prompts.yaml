cleaning: |
  No texto dado, verifique e corrija qualquer erro de formatação das palavras,
  que possam ter ocorrido devido a problemas de reconhecimento de caracteres ASCII.
  Isso inclui inserir espaços em branco faltantes, corrigir caracteres especiais que
  foram distorcidos e substituir caracteres corrompidos pelos seus equivalentes corretos.
  Por exemplo, 'Computac¸˜aoUb´ıqua' deve ser corrigido para 'Computação Ubíqua'.
  O texto final deve ser compreensível e sem erros de formatação.

field_completion: |
  Objetivo: Seu principal objetivo é extrair as informações especificadas abaixo contidas na primeira página de textos que foram convertidos de arquivos PDF de artigos científicos para formatos de texto.
  Mais especificamente, você deve complementar o objeto JSON fornecido na mensagem do usuário (apenas metadados do artigo, sem lista de referências) e executar as correções e preenchimentos necessários nos campos de dados, seguindo as instruções específicas para cada campo abaixo, quando possível, e retornar um único objeto JSON.

  Codificação na resposta: dentro das strings JSON use carateres Unicode literais (acentos, cedilhas, etc.) como aparecem no texto-fonte. NÃO use escapes no estilo \uXXXX — escapes mal formados ou desnecessários quebram o parse do JSON downstream.

  Você deve buscar informações específica da primeira página de um artigo científico. Estrutura típica do texto extraído de PDFs de artigos em anais (ex.: SBIE): no início aparecem o título do artigo; abaixo, os nomes dos autores; em seguida afiliações institucionais, cidades, países e, por vezes, e-mails; depois vêm as secções de resumo — "Resumo" / "Abstract" (por vezes ambas, em artigos bilíngues); a seguir costumam aparecer secções numeradas do corpo (ex.: "1. Introdução", "2. ..."), blocos de "Palavras-chave" / "Keywords", e linhas de rodapé dos anais (ex.: "Anais do ... SBIE", ISSN, local e data do evento). O excerto enviado pode incluir várias destas partes de propósito.
  Ao preencher abstractOrig e abstractEn a partir desse texto: copie apenas o(s) parágrafo(s) que constituem o resumo na língua pedida (secção Resumo para português, Abstract para inglês). Não inclua título, nomes de autores, afiliações, e-mails, texto da introdução ou de outras secções numeradas, palavras-chave, referências, notas de rodapé da página nem linhas de cabeçalho/rodapé dos anais. Pare imediatamente antes de qualquer marcador de nova secção (por exemplo "1. Introdução", "Keywords", "Palavras-chave", "Anais do").

  Se você não conseguir preencher ou corrigir um campo solicitado por falta de informação, ambiguidade ou baixa confiança, inclua no JSON um campo opcional "fieldFailureReasons" cujo valor é um objeto em que cada chave é o nome do campo não gerado/alterado e cada valor é uma string curta explicando o motivo.

  1) Correção de Formatação: Verifique e corrija qualquer erro de formatação nos campos do dicionário, se houver, que possam ter ocorrido devido a problemas de reconhecimento de caracteres ASCII. Isso inclui corrigir caracteres especiais que foram distorcidos e substituir caracteres corrompidos pelos seus equivalentes corretos, além de inserir espaços faltantes entre palavras.
  2) Título em Inglês (titleEn): Caso este campo esteja vazio, traduza o conteúdo do campo "titleOrig" para inglês e preencha o "titleEn" com a tradução.
  3) Resumo em português (abstractOrig): Apenas se este campo estiver vazio e a mensagem incluir texto da primeira página do artigo (PDF), preencha-o na seguinte ordem: (a) extraia e copie somente o texto da secção "Resumo" (ou equivalente), até ao fim do resumo, sem incluir o que vier depois (Abstract em inglês, introdução numerada, palavras-chave ou rodapé); (b) se não existir resumo em português no texto, use o abstract em inglês do PDF, se existir, traduzido para português, aplicando a mesma regra de exclusão (nada de corpo do artigo nem rodapé de anais).
  4) Resumo em inglês (abstractEn): Apenas se este campo estiver vazio e a mensagem incluir texto da primeira página do artigo (PDF), preencha-o na seguinte ordem: (a) extraia e copie fielmente somente o texto da secção em inglês (Abstract, ABSTRACT ou equivalente), até ao fim desse resumo, sem incluir "1. Introdução", palavras-chave nem rodapé dos anais; (b) se não existir abstract em inglês no texto, traduza o resumo em português (abstractOrig) para inglês em abstractEn. Não substitua um abstract em inglês já presente no PDF por uma tradução do português.
  5) Palavras-chave em Português (keywordsOrig): Se este campo estiver vazio, analise o resumo em português ("abstractOrig") e elabore de 3 a 5 palavras-chave relevantes, com base no conteúdo do resumo, e preencha o campo "keywordsOrig" com essas palavras-chave. Se não houver resumo mas houver texto da primeira página do artigo, use o texto para elaborar as palavras-chave.
  6) Palavras-chave em Inglês (keywordsEn): Caso este campo esteja vazio, traduza as palavras-chave do campo "keywordsOrig" para inglês e preencha o "keywordsEn" com as traduções.
  Resultado Esperado: Após realizar as correções e preenchimentos conforme as instruções detalhadas acima, produza um objeto JSON com apenas as chaves relevantes entre: idJEMS, seq, sectionAbbrev, titleOrig, titleEn, abstractOrig, abstractEn, keywordsOrig, keywordsEn, language, firstPage, pages, doi, numPages, authors, fieldFailureReasons. Omita chaves que não alterou, exceto quando o enunciado pedir para preencher um campo vazio. Não inclua "fieldFailureReasons" se não houver nenhum campo não gerado/alterado a justificar. NÃO inclua a chave "references" (referências vêm de outro passo do sistema). Se incluir "authors", mantenha os mesmos autores da entrada, sem alterar nomes. Sua resposta deve ser EXCLUSIVAMENTE esse objeto JSON, sem texto explicativo antes ou depois e sem repetir o corpo longo do artigo.


references_extraction: |
  Objetivo: Seu principal objetivo é extrair as referências bibliográficas contidas em textos que foram convertidos de arquivos PDF para formatos de texto. As referências devem ser preparadas para inclusão em um dicionário JSON, com especial atenção à inclusão de detalhes completos das referências. Cuidado para não incluir na referência o rodapé ou cabeçalho da página onde se encontra a referência.
  Nas strings JSON (campo "description" e demais), use carateres UTF-8 literais; não use escapes \uXXXX, pois podem causar JSON inválido no parse.
  Só extraia referencias bibliográficas quando houver (no caso de textos de artigos cientificos). Quando o texto não contiver referências (por exemplo, for de um editorial), não extrair e retornar um dicionário vazio.
  Processo de Extração:
  1. Identifique todas as referências bibliográficas no texto fornecido. Concentre-se em capturar cada referência na sua totalidade.
  2. Formate cada referência como um dicionário em uma lista de dicionários denominada "references". Cada item deve ser um dicionário JSON contendo os seguintes campos:
    - description: A referência completa (obrigatório).
    - doi: incluir essa chave, mas deixar o seu valor vazio.
    - link: incluir essa chave, mas deixar o seu valor vazio.
    - accessed: incluir essa chave, mas deixar o seu valor vazio.
  Exemplo de Saída JSON:
  ```json
  {
    "references": [
      {
        "description": "Referência completa aqui",
        "doi": "",
        "link": "",
        "accessed": ""
      },
      {
        "description": "Outra referência completa aqui",
        "doi": "",
        "link": "",
        "accessed": ""
      }
    ]
  }
  ```
  Validação e Correções:
  - Após a extração, revise as referências extraídas para corrigir quaisquer erros de formatação, especialmente aqueles relacionados a problemas de reconhecimento de caracteres ASCII (como caracteres especiais corrompidos) ou ausência de delimitadores (espaço em branco) entre as palavras.
  - Utilize ferramentas de validação JSON para garantir que a estrutura do dicionário JSON esteja correta e válida.
  Entrega:
  - Forneça o dicionário JSON com as referências extraídas, seguindo o formato especificado acima se houver referencias no texto. Caso não haja referencias (por exemplo, no caso de um editorial), retorne um dicionário vazio.
  - Evite incluir informações ou explicações adicionais não solicitadas.

text_processing: |
  Você é um assistente especializado em correção de texto com problemas de codificação.

  Analise o texto fornecido e corrija:
  1. Caracteres de acentuação quebrados
  2. Símbolos de codificação inválidos
  3. Preservando todo o conteúdo significativo

  Retorne apenas o texto corrigido, sem explicações ou comentários adicionais.

author_affiliation_email_extraction: |
  Você recebe:
  - uma lista de autores (nomes completos) já definida, na ordem em que aparecem no artigo;
  - e o texto da primeira página do artigo em PDF, até antes das seções "Resumo", "Resumen" ou "Abstract" (quando essas secções existirem no excerto).

  Objetivo: numa única resposta, devolver afiliações, país e e-mail de cada autor, todos alinhados à mesma ordem da lista de autores.

  1) Afiliações (instituição principal por autor):
  - "affiliations_pt": lista de strings — afiliação em português;
  - "affiliations_en": lista de strings — afiliação em inglês;
  - Considere apenas a INSTITUIÇÃO PRINCIPAL (ex.: universidade ou instituto principal).
  - NÃO inclua departamentos, faculdades, programas de pós-graduação, cursos, laboratórios ou grupos de pesquisa.
  - Formato "affiliations_pt": "Nome da universidade em português (SIGLA)" — ex.: "Universidade Federal de Sergipe (UFS)".
  - Formato "affiliations_en": "Nome da universidade em inglês (MESMA SIGLA)" — ex.: "Federal University of Sergipe (UFS)".
  - Várias instituições principais no mesmo autor: una com "|" entre elas (mesmo padrão em pt e en).
  - Se faltar afiliação para um autor, use "" em "affiliations_pt" e "affiliations_en" nessa posição.

  2) País:
  - "countries": lista de strings com o nome do país por extenso em português (ex.: "Brasil", "Portugal", "França"), alinhada à ordem dos autores. Não use códigos ISO de duas letras. Use "" se não for possível inferir.

  3) E-mails:
  - "emails": lista de strings — e-mail de cada autor na mesma ordem. Extraia do texto (cabeçalho, rodapé, lista de autores). Use "" se não encontrar.
  - Atenção a notações abreviadas: {a, b}@dominio.com expande para dois e-mails; coloque cada um na posição correta conforme a ordem dos autores.
  - Não invente e-mails.

  Regras gerais:
  - Todas as listas ("affiliations_pt", "affiliations_en", "countries", "emails") devem ter exatamente o mesmo comprimento e a mesma ordem que a lista de autores fornecida.
  - Não adicione nem remova autores.

  Saída:
  - Retorne APENAS um objeto JSON com esta estrutura:
    {
      "affiliations_pt": ["...", "..."],
      "affiliations_en": ["...", "..."],
      "countries": ["Brasil", "..."],
      "emails": ["...", "..."]
    }
  - Não inclua explicações nem texto fora desse JSON.
